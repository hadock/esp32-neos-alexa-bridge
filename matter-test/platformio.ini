; Standalone feasibility test: does the Arduino-ESP32 Matter stack (real
; MatterContactSensor endpoint) fit and run on our exact board (ESP32-S3,
; no PSRAM, 8MB flash) before we commit to rewriting the Alexa integration
; layer around it. Deliberately minimal -- no USB host, no fauxmoESP.

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Experiment: our pinned 3.3.11 core (latest stable release) has the
; ATTRIBUTE_FLAG_MANAGED_INTERNALLY bug on BooleanState::StateValue traced
; in the session. Current upstream `main` source doesn't show that flag
; being set for this attribute, so try pulling the framework straight from
; the unreleased dev branch to see if it's already fixed there. Real risk:
; this may not build cleanly, or may pull mismatched precompiled libs.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#master

; Matter needs a large single app partition (~3MB), no OTA slot.
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
