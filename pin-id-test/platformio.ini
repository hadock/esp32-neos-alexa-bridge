; Standalone pinout-identity check: blinks GPIO19/GPIO20 in an alternating
; pattern so LEDs wired to each pin can be visually matched against silkscreen
; labels. No EspUsbHost/USB host init here on purpose -- keep this dead simple
; and independent of the main firmware.

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
