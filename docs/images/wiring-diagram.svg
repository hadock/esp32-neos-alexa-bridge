<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">
    WyzeSense Bridge Dongle -- Wiring
  </text>

  <!-- External 5V source box -->
  <rect x="30" y="150" width="190" height="110" rx="10" fill="#fff4e5" stroke="#d97706" stroke-width="2"/>
  <text x="125" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">External 5V Source</text>
  <text x="125" y="205" text-anchor="middle" font-size="12" fill="#92400e">(wall charger or PC,</text>
  <text x="125" y="220" text-anchor="middle" font-size="12" fill="#92400e">via the board's "UART"</text>
  <text x="125" y="235" text-anchor="middle" font-size="12" fill="#92400e">USB-C port)</text>

  <!-- ESP32-S3 board box (middle) -->
  <rect x="330" y="90" width="200" height="240" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="430" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">ESP32-S3 Board</text>
  <text x="430" y="138" text-anchor="middle" font-size="11" fill="#047857">(native USB-OTG port,</text>
  <text x="430" y="152" text-anchor="middle" font-size="11" fill="#047857">EspUsbHost in host mode)</text>

  <!-- ESP32 pin labels facing the dongle (right side) -->
  <text x="515" y="210" text-anchor="end" font-size="12" fill="#b45309">VBUS (5V out)</text>
  <text x="515" y="230" text-anchor="end" font-size="12" fill="#1d4ed8">GPIO20 (D+)</text>
  <text x="515" y="250" text-anchor="end" font-size="12" fill="#1d4ed8">GPIO19 (D-)</text>
  <text x="515" y="270" text-anchor="end" font-size="12" fill="#111827">GND</text>

  <!-- Bridge dongle box (right) -->
  <rect x="630" y="120" width="200" height="180" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="730" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">WyzeSense Bridge</text>
  <text x="730" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">Dongle</text>
  <text x="730" y="185" text-anchor="middle" font-size="11" fill="#4338ca">(USB-A connector,</text>
  <text x="730" y="199" text-anchor="middle" font-size="11" fill="#4338ca">VID:PID 1a86:e024)</text>

  <text x="645" y="210" text-anchor="start" font-size="12" fill="#b45309">VBUS</text>
  <text x="645" y="230" text-anchor="start" font-size="12" fill="#1d4ed8">D+</text>
  <text x="645" y="250" text-anchor="start" font-size="12" fill="#1d4ed8">D-</text>
  <text x="645" y="270" text-anchor="start" font-size="12" fill="#111827">GND</text>

  <!-- Wires: external 5V -> ESP32 -->
  <line x1="220" y1="205" x2="330" y2="205" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="275" y="198" text-anchor="middle" font-size="11" fill="#92400e">5V</text>

  <line x1="220" y1="245" x2="330" y2="245" stroke="#111827" stroke-width="2.5"/>
  <text x="275" y="261" text-anchor="middle" font-size="11" fill="#111827">GND</text>

  <!-- Wires: ESP32 to dongle (all 4 signals, since the ESP32's own native USB
       port powers the dongle; confirmed this board's port supplies enough
       current, unlike the original DevKitC-1 test board earlier in this
       project's history) -->
  <line x1="530" y1="205" x2="630" y2="205" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="580" y="198" text-anchor="middle" font-size="11" fill="#92400e">VBUS</text>

  <line x1="530" y1="225" x2="630" y2="225" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="580" y="218" text-anchor="middle" font-size="11" fill="#1d4ed8">D+</text>

  <line x1="530" y1="245" x2="630" y2="245" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="580" y="238" text-anchor="middle" font-size="11" fill="#1d4ed8">D-</text>

  <line x1="530" y1="265" x2="630" y2="265" stroke="#111827" stroke-width="2.5"/>
  <text x="580" y="281" text-anchor="middle" font-size="11" fill="#111827">GND</text>

  <!-- Notes -->
  <text x="430" y="360" text-anchor="middle" font-size="12" fill="#374151">
    Power flows external source -&gt; ESP32 -&gt; dongle, all through the ESP32's own native USB port
  </text>
  <text x="430" y="378" text-anchor="middle" font-size="12" fill="#374151">
    (this board's native port supplies enough current for the dongle -- no separate dongle power feed needed).
  </text>

  <text x="430" y="404" text-anchor="middle" font-size="11" fill="#6b7280">
    Physically: a small perfboard/adapter carries VBUS/D+/D-/GND between the board's native USB-C port and the dongle's USB-A plug.
  </text>
</svg>
