; NEOS/WyzeSense USB bridge reader on ESP32-S3 native USB host, exposing
; each paired sensor to Alexa as a real Matter Contact/Occupancy sensor
; endpoint (proper sensor semantics -- Alexa Routines can trigger off
; these, unlike the earlier fauxmoESP/Hue-light approach).
;
; Serial console (Serial.print) stays on classic UART0 -> the board's
; "UART" USB-C port. The native "USB" port (GPIO19=D-/GPIO20=D+, wired
; separately to VBUS/GND via bodge wires) is left free for EspUsbHost to
; drive in host mode -- the two must not both claim the same USB-OTG
; peripheral, so we deliberately never enable ARDUINO_USB_CDC_ON_BOOT.

[env:esp32-s3-devkitc-1]
; Official PlatformIO espressif32 platform is stuck on Arduino-ESP32 ~2.0.x.
; EspUsbHost and Matter both need core >= 3.2.0 (IDF 5.x). Use the
; community pioarduino fork, which tracks current Arduino-ESP32 releases.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Track arduino-esp32 master directly rather than the pinned release: as
; of this writing the release (3.3.11) has a real bug in the Matter
; BooleanState-based sensor wrapper (contact/motion/leak/freeze/rain) that
; was only fixed on master today, in espressif/arduino-esp32#12842
; ("fix(matter): fix binary sensors for Matter 1.5"). Without this, every
; setContact()/setOccupancy() call fails with ESP_ERR_NOT_SUPPORTED and
; Alexa never sees a state change. Switch back to a normal release pin
; once a release containing that fix ships.
;
; This alone is NOT enough, though: the precompiled esp_matter library
; (framework-arduinoespressif32-libs) is a *separate* PlatformIO package
; this override doesn't touch, and it still ships the old, buggy binary
; built against pre-#12842 sources. See README.md's "Building the fixed
; Matter library" section for how to rebuild that package locally with
; the fix included (this project intentionally does not vendor the
; rebuilt binary -- it's ~20MB and specific to your exact toolchain
; version).
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#master

; Matter needs a large single app partition (~3MB), no OTA slot.
board_build.partitions = huge_app.csv

; PSRAM matters a lot here: Matter/CHIP + WiFi + our own USB-host stack
; genuinely don't fit reliably in this chip's ~320KB of on-chip RAM alone
; (see README's "Memory: why this needs PSRAM" section for the full story --
; short version: without it, Alexa's ~15 concurrent subscriptions to a
; 3-endpoint device reliably exhaust internal heap and attribute reports get
; silently dropped). Check your OWN board before trusting this blindly:
;
;   esptool.py --port <your-port> flash_id
;
; Look for "Embedded PSRAM" in the Features line. If your board has embedded
; PSRAM, Espressif's PSRAM-equipped chip variants ("R8"/"R2") always wire it
; over Octal SPI; check FLASH_TYPE via `espefuse.py summary` for whether your
; flash chip is Quad or Octal, and set the matching combination below
; (qio_opi = Quad flash + Octal PSRAM, our exact board; qio_qspi if you have
; no PSRAM at all; see the framework-arduinoespressif32-libs/esp32s3/
; directory for the other combinations PlatformIO ships).
board_build.arduino.memory_type = qio_opi

; Level 3 (Info) was useful while bringing up EspUsbHost/Matter for the
; first time, but the extra log strings/calls throughout the Arduino core
; cost real flash and a little RAM for no ongoing benefit now that both are
; working. Drop to 1 (Error only); bump back to 3+ temporarily if you need
; to debug WiFi/USB/Matter-core internals (our own app logs are plain
; Serial.print calls and are unaffected either way).
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM

lib_deps =
    https://github.com/tanakamasayuki/EspUsbHost.git
